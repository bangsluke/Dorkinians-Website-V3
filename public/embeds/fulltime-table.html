<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Full-Time league table</title>
	<style>
		html, body { margin: 0; padding: 8px; background: #fff; color: #111; font-family: Arial, sans-serif; }
	</style>
</head>
<body>
	<script>
		var code = new URLSearchParams(window.location.search).get("code") || "";
		var lrcode = /^\d{5,12}$/.test(code) ? code : "";
		if (!lrcode) {
			document.write("<p>League table embed code is missing.</p>");
		} else {
			document.write('<div id="lrep' + lrcode + '" style="width:100%">Data loading....</div>');
			document.write('<script src="https://fulltime.thefa.com/client/api/cs1.js"><' + '/script>');
		}
	</script>
</body>
</html>
